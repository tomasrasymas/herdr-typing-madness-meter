id = "typing-madness-meter"
name = "Typing Madness Meter"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Gamified typing for herdr: live WPM, combos, XP, achievements and a shaking meter"
platforms = ["macos"]

[[build]]
command = ["sh", "scripts/build.sh"]

[[actions]]
id = "toggle"
title = "Toggle Typing Madness Meter"
contexts = ["global", "workspace", "tab", "pane"]
command = ["node", "--disable-warning=ExperimentalWarning", "src/actions/toggle.ts"]

[[actions]]
id = "stats"
title = "Show Typing Madness Meter stats"
contexts = ["global", "workspace", "tab", "pane"]
command = ["node", "--disable-warning=ExperimentalWarning", "src/actions/stats.ts"]

[[actions]]
id = "reset"
title = "Reset Typing Madness Meter stats"
contexts = ["global"]
command = ["node", "--disable-warning=ExperimentalWarning", "src/actions/reset.ts"]

[[panes]]
id = "hud"
title = "Typing Madness Meter"
placement = "split"
command = ["node", "--disable-warning=ExperimentalWarning", "src/hud.ts"]

[[panes]]
id = "stats"
title = "Typing Madness Meter · stats"
placement = "popup"
width = "70%"
height = 24
command = ["node", "--disable-warning=ExperimentalWarning", "src/stats.ts"]

[[actions]]
id = "demo"
title = "Play Typing Madness Meter demo"
contexts = ["global", "workspace", "tab", "pane"]
command = ["node", "--disable-warning=ExperimentalWarning", "src/actions/demo.ts"]

[[panes]]
id = "demo"
title = "Typing Madness Meter · demo"
placement = "tab"
command = ["node", "--disable-warning=ExperimentalWarning", "src/demo-typer.ts"]

# Closing a tab or workspace kills the meter with it: reopen it under the
# pane that gets focus. Closing the meter's own pane switches it off.
[[events]]
on = "pane.closed"
command = ["node", "--disable-warning=ExperimentalWarning", "src/hooks/closed.ts"]

[[events]]
on = "tab.closed"
command = ["node", "--disable-warning=ExperimentalWarning", "src/hooks/closed.ts"]

[[events]]
on = "workspace.closed"
command = ["node", "--disable-warning=ExperimentalWarning", "src/hooks/closed.ts"]
